# Smithery.ai configuration for devbase
# https://smithery.ai

startCommand:
  type: stdio
  configSchema:
    type: object
    properties: {}
    required: []
  commandFunction:
    - |-
      (config) => ({
        command: "devbase",
        args: ["mcp"]
      })

description: |
  Developer Knowledge OS — manage Git repos, vault notes (Markdown), and assets.
  Provides 71 MCP tools (5 stable / 58 beta / 8 experimental) for repo scanning,
  health checks, code analysis, vault search/backlinks, agent sessions, workflows,
  knowledge graphs, and unified project context queries.

categories:
  - developer-tools
  - knowledge-management
  - version-control
