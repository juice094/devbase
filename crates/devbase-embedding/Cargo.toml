[package]
name = "devbase-embedding"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Embedding generation and storage protocol with Candle and Ollama backends"

[dependencies]
anyhow = "1"
serde_json = "1"
ureq = { version = "3", features = ["json"] }
candle-core = { version = "0.10" }
candle-nn = { version = "0.10" }
candle-transformers = { version = "0.10" }
tokenizers = { version = "0.22", default-features = false, features = [] }
hf-hub = { version = "0.5" }
